<svg xmlns="http://www.w3.org/2000/svg"
     width="100%" viewBox="0 0 1200 440" role="img"
     aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Vault Doctor：Obsidian Vault 体检与清理</title>
  <desc id="hero-desc">左侧项目名与一句话价值，中部三个 KPI，右侧一张九宫格体征清单，底部一行版本元信息。</desc>

  <rect width="1200" height="440" rx="24" fill="#16161e"/>

  <!-- 左侧：标题 + 一句话价值 -->
  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="88" fill="#9a9aab" font-size="22" letter-spacing="1">Obsidian Community Plugin</text>
    <text x="56" y="146" fill="#e6e6ef" font-size="62" font-weight="700">Vault Doctor</text>
    <rect x="56" y="162" width="26" height="6" rx="3" fill="#8b7cf6"/>
    <text x="56" y="204" fill="#e6e6ef" font-size="26" font-weight="600">扫描 9 类 Vault 问题，安全清理，顺带压缩图片</text>
    <text x="56" y="242" fill="#9a9aab" font-size="20">一键体检 · 安全清理 · 本地运行，无网络请求、无遥测。</text>
  </g>

  <!-- 中部：KPI 三张卡（底边 340） -->
  <g id="kpi-row" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g transform="translate(56 268)">
      <rect width="150" height="72" rx="14" fill="#1e1e2a"/>
      <text x="22" y="44" fill="#8b7cf6" font-size="38" font-weight="700">9</text>
      <text x="78" y="44" fill="#e6e6ef" font-size="17" font-weight="600">项检查</text>
      <text x="22" y="62" fill="#9a9aab" font-size="16">9 类问题</text>
    </g>
    <g transform="translate(222 268)">
      <rect width="150" height="72" rx="14" fill="#1e1e2a"/>
      <text x="22" y="44" fill="#8b7cf6" font-size="38" font-weight="700">1</text>
      <text x="78" y="44" fill="#e6e6ef" font-size="17" font-weight="600">键扫描</text>
      <text x="22" y="62" fill="#9a9aab" font-size="16">点一下就开始</text>
    </g>
    <g transform="translate(388 268)">
      <rect width="150" height="72" rx="14" fill="#1e1e2a"/>
      <text x="22" y="44" fill="#4ec9a0" font-size="38" font-weight="700">0</text>
      <text x="78" y="44" fill="#e6e6ef" font-size="17" font-weight="600">网络请求</text>
      <text x="22" y="62" fill="#9a9aab" font-size="16">全程本地运行</text>
    </g>
  </g>

  <!-- 右侧：3×3 体征九宫格（x=700 起，列 700/850/1000，行 y=92/162/232） -->
  <g id="vital-grid" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="700" y="72" fill="#9a9aab" font-size="19">Vault 体征九宫格</text>

    <!-- 第 1 行 y=92 -->
    <rect x="700" y="92" width="140" height="58" rx="12" fill="#1e1e2a"/>
    <circle cx="722" cy="121" r="9" fill="#4ec9a0"/>
    <text x="744" y="128" fill="#e6e6ef" font-size="19">未引用资源</text>

    <rect x="850" y="92" width="140" height="58" rx="12" fill="#1e1e2a"/>
    <circle cx="872" cy="121" r="9" fill="#4ec9a0"/>
    <text x="894" y="128" fill="#e6e6ef" font-size="19">空文件</text>

    <rect x="1000" y="92" width="140" height="58" rx="12" fill="#1e1e2a"/>
    <circle cx="1022" cy="121" r="9" fill="#e0a63a"/>
    <text x="1044" y="128" fill="#e6e6ef" font-size="19">重复文件</text>

    <!-- 第 2 行 y=162 -->
    <rect x="700" y="162" width="140" height="58" rx="12" fill="#1e1e2a"/>
    <circle cx="722" cy="191" r="9" fill="#e0a63a"/>
    <text x="744" y="198" fill="#e6e6ef" font-size="19">失效链接</text>

    <rect x="850" y="162" width="140" height="58" rx="12" fill="#1e1e2a"/>
    <circle cx="872" cy="191" r="9" fill="#4ec9a0"/>
    <text x="894" y="198" fill="#e6e6ef" font-size="19">原生链接</text>

    <rect x="1000" y="162" width="140" height="58" rx="12" fill="#1e1e2a"/>
    <circle cx="1022" cy="191" r="9" fill="#4ec9a0"/>
    <text x="1044" y="198" fill="#e6e6ef" font-size="19">空文件夹</text>

    <!-- 第 3 行 y=232 -->
    <rect x="700" y="232" width="140" height="58" rx="12" fill="#1e1e2a"/>
    <circle cx="722" cy="261" r="9" fill="#e0a63a"/>
    <text x="744" y="268" fill="#e6e6ef" font-size="19">Wiki 链接</text>

    <rect x="850" y="232" width="140" height="58" rx="12" fill="#1e1e2a"/>
    <circle cx="872" cy="261" r="9" fill="#4ec9a0"/>
    <text x="894" y="268" fill="#e6e6ef" font-size="19">图片压缩</text>

    <rect x="1000" y="232" width="140" height="58" rx="12" fill="#1e1e2a"/>
    <circle cx="1022" cy="261" r="9" fill="#4ec9a0"/>
    <text x="1044" y="268" fill="#e6e6ef" font-size="19">关联笔记</text>

    <!-- 图例 y=330 -->
    <circle cx="700" cy="327" r="7" fill="#4ec9a0"/>
    <text x="714" y="332" fill="#9a9aab" font-size="18">正常</text>
    <circle cx="810" cy="327" r="7" fill="#e0a63a"/>
    <text x="824" y="332" fill="#9a9aab" font-size="18">待处理</text>
  </g>

  <!-- 底部：mono 元信息 -->
  <text id="meta" x="56" y="404" fill="#9a9aab"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">v1.14.0 · Obsidian 1.13.0+ · Desktop only · 0-BSD</text>
</svg>
