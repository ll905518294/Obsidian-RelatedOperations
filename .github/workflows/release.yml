name: Release Obsidian plugin

on:
    push:
        tags:
            - '[0-9]*'

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Validate release version
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: node scripts/release-check.mjs "$RELEASE_TAG"

            - name: Build plugin
              run: |
                  npm ci
                  npm run build

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test

            - name: Package release ZIP
              run: |
                  npm run package
                  version="$(jq -r .version manifest.json)"
                  plugin_id="$(jq -r .id manifest.json)"
                  zip="dist/${plugin_id}-${version}.zip"
                  [ -f "$zip" ] || { echo "::error::packaging did not produce $zip"; exit 1; }
                  packaged_version="$(unzip -p "$zip" manifest.json | jq -r .version)"
                  [ "$packaged_version" = "$version" ] \
                    || { echo "::error::ZIP manifest version $packaged_version does not match $version"; exit 1; }
                  expected_entries=$'main.js\nmanifest.json'
                  if [ -f styles.css ]; then expected_entries+=$'\nstyles.css'; fi
                  expected_entries="$(printf '%s\n' "$expected_entries" | sort)"
                  actual_entries="$(unzip -Z1 "$zip" | sort)"
                  [ "$actual_entries" = "$expected_entries" ] \
                    || { echo "::error::ZIP entries must be exactly main.js, manifest.json and optional styles.css; got: $(echo "$actual_entries" | tr '\n' ' ')"; exit 1; }
                  echo "PACKAGE_ZIP=$zip" >> "$GITHUB_ENV"

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Collect attest subjects
              id: attest
              run: |
                  {
                    echo 'subject-path<<EOF'
                    printf '%s\n' "main.js"
                    if [ "${{ steps.styles.outputs.exists }}" = "true" ]; then printf '%s\n' "styles.css"; fi
                    echo 'EOF'
                  } >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: ${{ steps.attest.outputs.subject-path }}

            - name: Generate release notes
              run: |
                  node scripts/release-notes.mjs > release-notes.md
                  version="$(jq -r .version manifest.json)"
                  min_app="$(jq -r .minAppVersion manifest.json)"
                  zip="${PACKAGE_ZIP:-}"
                  {
                    echo ""
                    echo "---"
                    echo ""
                    echo "Version: $version"
                    echo "Minimum Obsidian: $min_app"
                    echo ""
                    echo "SHA-256:"
                    for file in main.js manifest.json styles.css "$zip"; do
                      if [ -n "$file" ] && [ -f "$file" ]; then sha256sum "$file"; fi
                    done
                  } >> release-notes.md
                  cat release-notes.md

            - name: Create or update release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  if [ -z "${PACKAGE_ZIP:-}" ]; then
                    echo "::error::PACKAGE_ZIP is empty, the packaging step did not run"; exit 1
                  fi

                  assets=(main.js manifest.json "$PACKAGE_ZIP")
                  if [ -f styles.css ]; then
                    assets=(main.js manifest.json styles.css "$PACKAGE_ZIP")
                  fi

                  if gh release view "$tag" >/dev/null 2>&1; then
                    echo "Release $tag already exists; updating notes and assets"
                    gh release edit "$tag" --title="$tag" --notes-file release-notes.md
                    gh release upload "$tag" "${assets[@]}" --clobber
                  else
                    gh release create "$tag" --verify-tag \
                      --title="$tag" \
                      --notes-file release-notes.md \
                      "${assets[@]}"
                  fi

            - name: Verify release assets
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  body="$(gh release view "$tag" --json body --jq .body)"
                  [ -n "$body" ] \
                    || { echo "::error::release $tag has an empty body"; exit 1; }
                  echo "$body" | grep -q '^## 更新说明' \
                    || { echo "::error::release $tag body is missing the release-notes heading"; exit 1; }
                  echo "Release notes (first 12 lines):"
                  echo "$body" | sed -n '1,12p'
                  names="$(gh release view "$tag" --json assets --jq '.assets[].name')"
                  for file in main.js manifest.json styles.css; do
                    [ -f "$file" ] || continue
                    echo "$names" | grep -qx "$file" \
                      || { echo "::error::release $tag is missing asset $file"; exit 1; }
                  done
                  zip_name="$(basename "${PACKAGE_ZIP:-}")"
                  if [ -n "$zip_name" ]; then
                    echo "$names" | grep -qx "$zip_name" \
                      || { echo "::error::release $tag is missing asset $zip_name"; exit 1; }
                  fi
                  echo "Release assets verified: $(echo "$names" | tr '\n' ' ')"
