name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Validate release version
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  node --input-type=module -e '
                  import { readFileSync } from "node:fs";

                  const manifest = JSON.parse(readFileSync("manifest.json", "utf8"));
                  const versions = JSON.parse(readFileSync("versions.json", "utf8"));
                  const tag = process.env.RELEASE_TAG;

                  if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.test(manifest.version)) {
                      throw new Error(`manifest.json version must be a SemVer value without a v prefix: ${manifest.version}`);
                  }
                  if (tag !== manifest.version) {
                      throw new Error(`Release tag ${tag} must exactly match manifest.json version ${manifest.version}`);
                  }
                  if (versions[manifest.version] !== manifest.minAppVersion) {
                      throw new Error(`versions.json must map ${manifest.version} to ${manifest.minAppVersion}`);
                  }
                  '

            - name: Build plugin
              run: |
                  npm ci
                  npm run build

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: Generate release notes
              run: |
                  version="$(jq -r .version manifest.json)"
                  min_app="$(jq -r .minAppVersion manifest.json)"
                  {
                    echo "Version: $version"
                    echo "Minimum Obsidian: $min_app"
                    echo ""
                    echo "SHA-256:"
                    for file in main.js manifest.json styles.css; do
                      if [ -f "$file" ]; then sha256sum "$file"; fi
                    done
                  } > release-notes.md
                  cat release-notes.md

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --title="$tag" \
                    --notes-file release-notes.md \
                    main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: Verify release assets
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  names="$(gh release view "$tag" --json assets --jq '.assets[].name')"
                  for file in main.js manifest.json styles.css; do
                    [ -f "$file" ] || continue
                    echo "$names" | grep -qx "$file" \
                      || { echo "::error::release $tag is missing asset $file"; exit 1; }
                  done
                  echo "Release assets verified: $(echo "$names" | tr '\n' ' ')"
