name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Validate release version
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  node --input-type=module -e '
                  import { readFileSync } from "node:fs";

                  const manifest = JSON.parse(readFileSync("manifest.json", "utf8"));
                  const pkg = JSON.parse(readFileSync("package.json", "utf8"));
                  const versions = JSON.parse(readFileSync("versions.json", "utf8"));
                  const tag = process.env.RELEASE_TAG;
                  const semver = /^\d+\.\d+\.\d+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;

                  if (!semver.test(manifest.version)) {
                      throw new Error(`manifest.json version must be a SemVer value without a v prefix: ${manifest.version}`);
                  }
                  if (typeof manifest.id !== "string" || !/^[a-z0-9](?:[a-z0-9._-]*[a-z0-9_-])?$/.test(manifest.id)) {
                      throw new Error(`manifest.json id must be a valid Obsidian plugin id: ${JSON.stringify(manifest.id)}`);
                  }
                  if (typeof manifest.minAppVersion !== "string" || !semver.test(manifest.minAppVersion)) {
                      throw new Error(`manifest.json minAppVersion must be a SemVer value: ${JSON.stringify(manifest.minAppVersion)}`);
                  }
                  if (pkg.version !== manifest.version) {
                      throw new Error(`package.json version ${pkg.version} must match manifest.json version ${manifest.version}`);
                  }
                  if (tag !== manifest.version) {
                      throw new Error(`Release tag ${tag} must exactly match manifest.json version ${manifest.version}`);
                  }
                  if (versions[manifest.version] !== manifest.minAppVersion) {
                      throw new Error(`versions.json must map ${manifest.version} to ${manifest.minAppVersion}`);
                  }
                  '

            - name: Build plugin
              run: |
                  npm ci
                  npm run build

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test

            - name: Package release ZIP
              run: |
                  npm run package
                  version="$(jq -r .version manifest.json)"
                  plugin_id="$(jq -r .id manifest.json)"
                  zip="dist/${plugin_id}-${version}.zip"
                  [ -f "$zip" ] || { echo "::error::packaging did not produce $zip"; exit 1; }
                  packaged_version="$(unzip -p "$zip" manifest.json | jq -r .version)"
                  [ "$packaged_version" = "$version" ] \
                    || { echo "::error::ZIP manifest version $packaged_version does not match $version"; exit 1; }
                  expected_entries=$'main.js\nmanifest.json'
                  if [ -f styles.css ]; then expected_entries+=$'\nstyles.css'; fi
                  expected_entries="$(printf '%s\n' "$expected_entries" | sort)"
                  actual_entries="$(unzip -Z1 "$zip" | sort)"
                  [ "$actual_entries" = "$expected_entries" ] \
                    || { echo "::error::ZIP entries must be exactly main.js, manifest.json and optional styles.css; got: $(echo "$actual_entries" | tr '\n' ' ')"; exit 1; }
                  echo "PACKAGE_ZIP=$zip" >> "$GITHUB_ENV"

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: Generate release notes
              run: |
                  version="$(jq -r .version manifest.json)"
                  min_app="$(jq -r .minAppVersion manifest.json)"
                  zip="${PACKAGE_ZIP:-}"
                  {
                    echo "Version: $version"
                    echo "Minimum Obsidian: $min_app"
                    echo ""
                    echo "SHA-256:"
                    for file in main.js manifest.json styles.css "$zip"; do
                      if [ -n "$file" ] && [ -f "$file" ]; then sha256sum "$file"; fi
                    done
                  } > release-notes.md
                  cat release-notes.md

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  if [ -z "${PACKAGE_ZIP:-}" ]; then
                    echo "::error::PACKAGE_ZIP is empty, the packaging step did not run"; exit 1
                  fi

                  gh release create "$tag" --verify-tag \
                    --title="$tag" \
                    --notes-file release-notes.md \
                    main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }} \
                    "${PACKAGE_ZIP}"

            - name: Verify release assets
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  names="$(gh release view "$tag" --json assets --jq '.assets[].name')"
                  for file in main.js manifest.json styles.css; do
                    [ -f "$file" ] || continue
                    echo "$names" | grep -qx "$file" \
                      || { echo "::error::release $tag is missing asset $file"; exit 1; }
                  done
                  zip_name="$(basename "${PACKAGE_ZIP:-}")"
                  if [ -n "$zip_name" ]; then
                    echo "$names" | grep -qx "$zip_name" \
                      || { echo "::error::release $tag is missing asset $zip_name"; exit 1; }
                  fi
                  echo "Release assets verified: $(echo "$names" | tr '\n' ' ')"
