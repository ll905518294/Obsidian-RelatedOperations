name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Validate release version
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  node --input-type=module -e '
                  import { readFileSync } from "node:fs";

                  const manifest = JSON.parse(readFileSync("manifest.json", "utf8"));
                  const versions = JSON.parse(readFileSync("versions.json", "utf8"));
                  const tag = process.env.RELEASE_TAG;

                  if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.test(manifest.version)) {
                      throw new Error(`manifest.json version must be a SemVer value without a v prefix: ${manifest.version}`);
                  }
                  if (tag !== manifest.version) {
                      throw new Error(`Release tag ${tag} must exactly match manifest.json version ${manifest.version}`);
                  }
                  if (versions[manifest.version] !== manifest.minAppVersion) {
                      throw new Error(`versions.json must map ${manifest.version} to ${manifest.minAppVersion}`);
                  }
                  '

            - name: Build plugin
              run: |
                  npm ci
                  npm run build

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --title="$tag" \
                    --draft \
                    main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
